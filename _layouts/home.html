---
layout: look
---
{{ content }}

{% assign projects = site.projects | sort: 'date' | reverse %}
<script>
	// The lists the home page draws, written by Jekyll from _projects/, _posts/ and _data/photojournalism.yml.
	window.HOME = {
		projects: [{% for p in projects %}
			{ "t": {{ p.title | remove: '⋱' | strip | jsonify }}, "kind": {{ p.chart_type | jsonify }}, "tools": {{ p.tools | jsonify }}, "topic": {{ p.topic | jsonify }}, "img": {{ p.featured_image | relative_url | jsonify }}, "url": {{ p.url | relative_url | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}
		],
		work: [{% for post in site.posts %}
			{ "t": {{ post.title | jsonify }}, "date": {{ post.date | date: "%B %Y" | jsonify }}, "img": {{ post.featured_image | relative_url | jsonify }}, "url": {{ post.url | relative_url | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}
		],
		photos: [{% for ph in site.data.photojournalism.photos %}
			{ "t": {{ ph.title | jsonify }}, "sub": {{ ph.subtitle | jsonify }}, "img": {{ ph.image | relative_url | jsonify }}, "url": {{ '/photojournalism' | relative_url | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}
		],
	};
</script>
<script defer src="{{ '/js/home.js' | relative_url }}"></script>
