photos:
  - title: "July 1, 2022"
    subtitle: "Chinese President Xi Jinping visited Hong Kong. A police officer peeked through rows of barricades."
    image: "/images/photojournalism/XivisitsHK.png"
  - title: "December 6, 2022"
    subtitle: "After the death of former Chinese president Jiang Zemin, lawmakers watched a memorial ceremony for more than an hour.The right-angle standing markers and bows both form a right angle."
    image: "/images/photojournalism/Funeral.jpeg"
  - title: "October 1, 2022"
    subtitle: "At a Hong Kong university’s National Day flag-raising ceremony, all attendees wore the same red masks to show allegiance during the Covid pandemic."
    image: "/images/photojournalism/Nationalday.png"
  - title: "November 28, 2022"
    subtitle: "A mainland Chinese student in the A4 Paper protest, wearing a T-shirt that says “We have to be very strong, if we want to do something very wrong.”"
    image: "/images/photojournalism/A4protest.jpeg"
  - title: "May 24, 2022"
    subtitle: "The 90-year-old cardinal Joseph Zen kept his head down and gently raised his fist in response to supporters’ cheers. He was among five democracy advocates arrested."
    image: "/images/photojournalism/cardinal.png"
  - title: "June 8, 2023"
    subtitle: "Prison guards used shields to block journalists’ view of activist Chow Hang Tung as she smiled through a gap."
    image: "/images/photojournalism/ChowHangTung.jpg"
  - title: "October 21, 2022"
    subtitle: "Kwok Cheuk-kin, known as Cheung Chau’s “King of Judicial Reviews”, won a judicial review case over the government’s Covid-19 vaccine exemption certificates"
    image: "/images/photojournalism/Appeal.JPG"
  - title: "15 April 2023"
    subtitle: "Activist/artist Luke Ching Chin Wai worked as a clearner at a metro station to shed light on clearners' labor rights"
    image: "/images/photojournalism/Ching.jpeg"